name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ecommerce/api exec prisma validate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: validate
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e-root-password
          MYSQL_DATABASE: ecommerce_platform_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://root:e2e-root-password@127.0.0.1:3306/ecommerce_platform_e2e
      E2E_DATABASE_URL: mysql://root:e2e-root-password@127.0.0.1:3306/ecommerce_platform_e2e
      JWT_ACCESS_SECRET: e2e-access-secret-that-is-at-least-32-characters
      JWT_REFRESH_SECRET: e2e-refresh-secret-that-is-at-least-32-characters
      FRONTEND_URL: http://localhost:5173
      ADMIN_URL: http://localhost:5174
      COOKIE_SECURE: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ecommerce/api exec prisma generate
      - run: pnpm --filter @ecommerce/api exec prisma migrate deploy
      - run: pnpm --filter @ecommerce/api db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/report/
